[package]
name = "faceit-bypass"
version = "0.1.0"
edition = "2021"
description = "Берёт строку IP сервера FACEIT и запускает обход zapret только для этого адреса"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
